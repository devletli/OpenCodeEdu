# Pre-commit quality gates (TASK2.md Phase 3).
# Catches E741 and other lint errors locally before they reach CI.
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]

  # pytest stays out of the hooks (too slow per commit); CI runs `make check`.
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy --strict
        entry: python3 -m mypy src/
        language: system
        pass_filenames: false
